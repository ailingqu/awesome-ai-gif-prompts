name: Submit a GIF prompt
description: Share a prompt and the GIF it produced
labels: ["new prompt"]
body:
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: Sleepy bunny sticker
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: ["Stickers & Reactions", "Flash Cuts & Brand Reels", "Ambient Loops", "Pixel Art & UI Motion", "Other"]
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt
      render: text
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: gpt-image-2.6
  - type: textarea
    id: gif
    attributes:
      label: Result GIF
      description: Drag the unedited GIF here.
    validations:
      required: true
